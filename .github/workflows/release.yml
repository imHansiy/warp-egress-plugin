name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross compiler (arm64)
        if: matrix.cc != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: go test ./...

      - name: Validate registry files
        run: python3 scripts/validate-registry.py

      - name: Build shared library
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "dist/warp-egress_${GOOS}_${GOARCH}"
          go build -trimpath -buildmode=c-shared -ldflags="-s -w" \
            -o "dist/warp-egress_${GOOS}_${GOARCH}/warp-egress.so" ./cmd/warp-egress

      - name: ABI smoke test (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: python3 scripts/abi_smoke_test.py dist/warp-egress_linux_amd64/warp-egress.so

      # 插件商店格式：zip 根目录必须直接包含 .so（不能放子目录）
      - name: Package plugin zip
        run: |
          cd "dist/warp-egress_${{ matrix.goos }}_${{ matrix.goarch }}"
          zip -q "../warp-egress_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" warp-egress.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-egress-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/warp-egress_${{ steps.version.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
