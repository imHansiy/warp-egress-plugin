name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Debian 11 (GLIBC 2.31) 容器构建，保证 .so 在老系统上可加载
    container:
      image: golang:1.23-bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install python3 (registry/smoke checks)
        run: |
          apt-get update
          apt-get install -y python3

      - name: Install cross compiler (arm64)
        if: matrix.cc != ''
        run: apt-get install -y gcc-aarch64-linux-gnu

      - name: Run tests
        run: go test ./...

      - name: Validate registry files
        run: python3 scripts/validate-registry.py

      - name: Build shared library
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p bin
          go build -trimpath -buildmode=c-shared -ldflags="-s -w" \
            -o "bin/warp-egress_${GOOS}_${GOARCH}.so" ./cmd/warp-egress

      - name: ABI smoke test (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: python3 scripts/abi_smoke_test.py bin/warp-egress_linux_amd64.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-egress-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/warp-egress_${{ matrix.goos }}_${{ matrix.goarch }}.so
          if-no-files-found: error
