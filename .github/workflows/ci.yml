name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build & verify (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # Debian 11 (GLIBC 2.31) 容器构建，保证 .so 在老系统上可加载
    container:
      image: golang:1.23-bullseye
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
          - goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install python3 (registry/smoke checks)
        run: |
          apt-get update
          apt-get install -y python3

      - name: Install cross compiler
        if: matrix.cc != ''
        run: |
          case "${{ matrix.goos }}" in
            linux) apt-get install -y gcc-aarch64-linux-gnu ;;
            windows) apt-get install -y gcc-mingw-w64-x86-64 ;;
          esac

      - name: Run tests
        run: go test -timeout 5m ./...

      - name: Validate registry files
        run: python3 scripts/validate-registry.py

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Download embedded tools for target platform
        run: GOOS_ARCH=${{ matrix.goos }}_${{ matrix.goarch }} ./scripts/download-tools.sh

      - name: Build shared library
        env:
          CC: ${{ matrix.cc }}
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p bin
          ext=so
          [ "$GOOS" = windows ] && ext=dll
          [ "$GOOS" = darwin ] && ext=dylib
          go build -buildvcs=false -trimpath -buildmode=c-shared -ldflags="-s -w -X warp-egress-plugin/cmd/warp-egress/version.Version=${VERSION}" \
            -o "bin/warp-egress_${GOOS}_${GOARCH}.${ext}" ./cmd/warp-egress

      - name: ABI smoke test (linux/amd64 only)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: python3 scripts/abi_smoke_test.py bin/warp-egress_linux_amd64.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-egress-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/warp-egress_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error

  build-darwin:
    name: Build & verify (darwin/${{ matrix.goarch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -timeout 5m ./...

      - name: Download embedded tools for target platform
        run: GOOS_ARCH=darwin_${{ matrix.goarch }} ./scripts/download-tools.sh

      - name: Resolve version
        id: version
        run: echo "version=$(git describe --tags --always --dirty 2>/dev/null | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Build shared library
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p bin
          go build -buildvcs=false -trimpath -buildmode=c-shared -ldflags="-s -w -X warp-egress-plugin/cmd/warp-egress/version.Version=${VERSION}" \
            -o "bin/warp-egress_darwin_${GOARCH}.dylib" ./cmd/warp-egress

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: warp-egress-darwin-${{ matrix.goarch }}
          path: bin/warp-egress_darwin_${{ matrix.goarch }}.dylib
          if-no-files-found: error
